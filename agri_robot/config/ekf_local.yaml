# EKF Local — fuses wheel odometry + IMU
# Output: /odometry/filtered  (odom frame — relative, drifts over time)
# Used by: Nav2 local planner, navsat_transform_node
#
# Sensor fusion matrix layout (15 values per sensor):
#   [x, y, z,  roll, pitch, yaw,  vx, vy, vz,  vroll, vpitch, vyaw,  ax, ay, az]

/**:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true        # outdoor flat field — no 3D needed
    publish_tf: true

    map_frame:       map
    odom_frame:      odom
    base_link_frame: base_link
    world_frame:     odom   # local EKF works in odom frame

    # ── Wheel Odometry (/odom) ──────────────────────────────────
    # Trust: linear velocity (vx) and yaw rate (vyaw)
    # Do NOT trust position directly (odometry drifts)
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # ── IMU (/imu/data) ─────────────────────────────────────────
    # Trust: yaw orientation, yaw rate (vyaw), linear acceleration (ax, ay)
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  true,  true,  false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10
